name: Build N60 Pro 25.12.1 MTWiFi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'config/**'

concurrency:
  group: n60pro-25.12.1-mtwifi
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      # Exact signed ImmortalWrt v25.12.1 release commit.
      OFFICIAL_COMMIT: a3378d1a2c15beb2faf4b0bce9c00f07143efa29
      MTK_COMMIT: eb724bb94de346f36b35bdb0f7de31b529bbc885
      RADIO_COMMIT: ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8
      TZ: Asia/Tokyo

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone official ImmortalWrt 25.12.1 and MTK 6.12 donor
        run: |
          git clone --filter=blob:none https://github.com/immortalwrt/immortalwrt.git source
          cd source
          git fetch --depth=1 origin "$OFFICIAL_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$OFFICIAL_COMMIT"
          grep -q '25.12.1' include/version.mk
          cd ..
          git clone --filter=blob:none https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git mtk-donor
          cd mtk-donor
          git fetch --depth=1 origin "$MTK_COMMIT"
          git checkout --detach FETCH_HEAD
          cd ..

      - name: Apply MTK stack, 237 radio profile, 2G/512M layout
        run: |
          bash ./scripts/prepare.sh "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/mtk-donor" "$GITHUB_WORKSPACE"

      - name: Update feeds
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Resolve config
        working-directory: source
        run: |
          make defconfig
          grep -E 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro|CONFIG_PACKAGE_kmod-mt_wifi|CONFIG_PACKAGE_mtwifi-cfg=|CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673|CONFIG_MTK_MT_WIFI_MT7986_20260601|CONFIG_MTK_FIRST_IF_IPAILNA|CONFIG_MTK_FAST_NAT_SUPPORT|CONFIG_MTK_WHNAT_SUPPORT|CONFIG_MTK_WARP_V2' .config || true
          grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-mt_wifi=y' .config
          grep -qx 'CONFIG_PACKAGE_mtwifi-cfg=y' .config
          grep -qx 'CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673=y' .config
          grep -qx 'CONFIG_MTK_MT_WIFI_MT7986_20260601=y' .config
          grep -qx 'CONFIG_MTK_FIRST_IF_IPAILNA=y' .config
          ! grep -qx 'CONFIG_PACKAGE_kmod-warp=y' .config
          ! grep -qx 'CONFIG_PACKAGE_kmod-mediatek_hnat=y' .config
          ! grep -Eq '^CONFIG_MTK_FAST_NAT_SUPPORT=(y|m)$' .config
          ! grep -Eq '^CONFIG_MTK_WHNAT_SUPPORT=(y|m)$' .config
          ! grep -Eq '^CONFIG_MTK_WARP_V2=(y|m)$' .config
          ! grep -qx 'CONFIG_PACKAGE_mtwifi-cfg-ucode=y' .config

      - name: Download sources
        working-directory: source
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -delete || true

      - name: Build firmware
        id: build
        working-directory: source
        shell: bash
        run: |
          set +e
          make -j"$(nproc)" > "$GITHUB_WORKSPACE/build-parallel.log" 2>&1
          rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "Build completed successfully."
            exit 0
          fi

          echo "Parallel build failed (rc=$rc); retrying with make -j1 V=s."
          make -j1 V=s > "$GITHUB_WORKSPACE/build-verbose.log" 2>&1
          rc=$?

          if [ "$rc" -ne 0 ]; then
            {
              echo "===== MATCHED ERRORS ====="
              grep -Ein 'error:|fatal:|undefined reference|No rule to make target|not found|failed|Error [0-9]+' "$GITHUB_WORKSPACE/build-verbose.log" | tail -n 250 || true
              echo
              echo "===== LAST 350 LINES ====="
              tail -n 350 "$GITHUB_WORKSPACE/build-verbose.log" || true
            } | tee "$GITHUB_WORKSPACE/build-error.log"
          fi

          exit "$rc"

      - name: Collect firmware
        run: |
          mkdir -p artifact
          find source/bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*netcore_n60-pro*squashfs-sysupgrade.itb' -o -name 'sha256sums' -o -name 'profiles.json' -o -name '*.buildinfo' \) \
            -exec cp -v {} artifact/ \;
          test -n "$(find artifact -type f -name '*netcore_n60-pro*squashfs-sysupgrade.itb' -print -quit)"
          grep -q '25.12.1' artifact/profiles.json
          ! grep -q '25.12-SNAPSHOT' artifact/profiles.json
          cd artifact
          sha256sum * > BUILD-SHA256SUMS

      - name: Upload compact build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-${{ github.run_number }}
          path: build-error.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: N60Pro-ImmortalWrt-25.12.1-MTWiFi-237-512M-2G
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
