name: Build N60 Pro 25.12.1 MTWiFi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'config/**'

concurrency:
  group: n60pro-25.12.1-mtwifi
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      OFFICIAL_COMMIT: a3378d1a2c15beb2faf4b0bce9c00f07143efa29
      MTK_COMMIT: eb724bb94de346f36b35bdb0f7de31b529bbc885
      GOLDEN_MT_WIFI_COMMIT: 4c657c93546c86cd9f9d83cd5931b5056e652dbb
      RADIO_COMMIT: ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8
      TZ: Asia/Tokyo

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone official ImmortalWrt 25.12.1 and MTK 6.12 donor
        run: |
          git clone --filter=blob:none https://github.com/immortalwrt/immortalwrt.git source
          cd source
          git fetch --depth=1 origin "$OFFICIAL_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$OFFICIAL_COMMIT"
          grep -q '25.12.1' include/version.mk
          cd ..
          git clone --filter=blob:none https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git mtk-donor
          cd mtk-donor
          git fetch --depth=1 origin "$MTK_COMMIT"
          git checkout --detach FETCH_HEAD
          cd ..

      - name: Apply MTK stack, 237 radio profile, 2G/512M layout
        run: |
          bash ./scripts/prepare.sh "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/mtk-donor" "$GITHUB_WORKSPACE"
          bash ./scripts/fix-wifi-utility-module.sh "$GITHUB_WORKSPACE/source"

      - name: Update feeds
        working-directory: source
        run: |
          bash "$GITHUB_WORKSPACE/scripts/prepare-final-apps.sh" "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE"
          ./scripts/feeds update -a
          git -C feeds/istore checkout --detach 6f795b7640390ab28a2f1aaa14b33292aa5f2128
          test "$(git -C feeds/istore rev-parse HEAD)" = "6f795b7640390ab28a2f1aaa14b33292aa5f2128"
          ./scripts/feeds install -a

      - name: Rebase official release config and kernel sidecar
        run: |
          bash ./scripts/rebase-official-release-config.sh "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE"

      - name: Resolve config
        working-directory: source
        run: |
          trap 'rc=$?; echo "::error::Resolve config failed: line=$LINENO command=$BASH_COMMAND rc=$rc"; exit $rc' ERR
          # The release config is a buildbot repository config. Preserve its
          # target/kernel settings, but do not compile every optional kmod,
          # every target-specific package, SDK, ImageBuilder or toolchain.
          sed -i -E '/^CONFIG_PACKAGE_.*=m$/d' .config
          for sym in ALL_KMODS ALL_NONSHARED SDK SDK_LLVM_BPF IB MAKE_TOOLCHAIN COLLECT_KERNEL_DEBUG; do
            sed -i -E "/^CONFIG_${sym}=y$/d; /^# CONFIG_${sym} is not set$/d" .config
            echo "# CONFIG_${sym} is not set" >> .config
          done

          make defconfig
          grep -E '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-store|dnsmasq|dnsmasq-full|kmod-nft-tproxy)=' .config || true

          test -f .config.kernel-official
          grep -qx 'CONFIG_ALL_KMODS=y' .config.kernel-official
          grep -qx 'CONFIG_ALL_NONSHARED=y' .config.kernel-official
          grep -qx '# CONFIG_ALL_KMODS is not set' .config
          grep -qx '# CONFIG_ALL_NONSHARED is not set' .config
          grep -Fq '$(TOPDIR)/.config.kernel-official >> $(LINUX_DIR)/.config.target' include/kernel-defaults.mk
          grep -Fq '$(TOPDIR)/.config.kernel-official $(KERNEL_PATCHVER) > $(LINUX_DIR)/.config.override' include/kernel-defaults.mk
          ! grep -Fq '$(TOPDIR)/.config >> $(LINUX_DIR)/.config.target' include/kernel-defaults.mk
          ! grep -Fq 'package-metadata.pl kconfig $(TMP_DIR)/.packageinfo $(TOPDIR)/.config $(KERNEL_PATCHVER)' include/kernel-defaults.mk
          scripts/package-metadata.pl kconfig tmp/.packageinfo .config.kernel-official 6.12 > "$GITHUB_WORKSPACE/kernel-sidecar.config.override"
          scripts/package-metadata.pl kconfig tmp/.packageinfo .config 6.12 > "$GITHUB_WORKSPACE/kernel-trimmed.config.override"
          test -s "$GITHUB_WORKSPACE/kernel-sidecar.config.override"
          ! cmp -s "$GITHUB_WORKSPACE/kernel-sidecar.config.override" "$GITHUB_WORKSPACE/kernel-trimmed.config.override"
          test "$(wc -l < "$GITHUB_WORKSPACE/kernel-sidecar.config.override")" -gt "$(wc -l < "$GITHUB_WORKSPACE/kernel-trimmed.config.override")"

          for sym in WIRELESS_EXT WEXT_CORE WEXT_PRIV WEXT_PROC WEXT_SPY; do
            grep -qx "CONFIG_${sym}=y" target/linux/generic/config-6.12
          done
          grep -qx '# CONFIG_ALL_KMODS is not set' .config
          grep -qx '# CONFIG_ALL_NONSHARED is not set' .config
          for sym in BUILDBOT AUTOREMOVE AUTOREBUILD; do
            grep -qx "# CONFIG_${sym} is not set" .config
          done
          grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-mt_wifi=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-mt-wifi-utility=y' .config
          grep -qx 'CONFIG_PACKAGE_mtwifi-cfg-ucode=y' .config
          grep -qx 'CONFIG_PACKAGE_wireless-tools=y' .config
          grep -qx 'CONFIG_PACKAGE_iwinfo-ucode=y' .config
          grep -qx 'CONFIG_PACKAGE_ucode-mod-iwinfo=y' .config
          grep -qx 'CONFIG_PACKAGE_ucode-mod-datconf=y' .config
          grep -qx 'CONFIG_PACKAGE_ucode-mod-l1parser=y' .config
          grep -qx 'CONFIG_PACKAGE_wifi-scripts=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-openclash=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-store=y' .config
          grep -qx 'CONFIG_PACKAGE_dnsmasq-full=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-nft-tproxy=y' .config
          ! grep -qx 'CONFIG_PACKAGE_dnsmasq=y' .config
          grep -qx '# CONFIG_MTK_MT7986_NEW_FW is not set' .config
          grep -qx 'CONFIG_MTK_WIFI_FW_BIN_LOAD=y' .config
          ! grep -Eq '^CONFIG_MTK_MT_WIFI_DRIVER_VERSION_(7661|7673)=y$' .config
          ! grep -Eq '^CONFIG_MTK_MT_WIFI_MT7986_GOLDEN_7661=y$' .config
          ! grep -Eq '^CONFIG_MTK_MT_WIFI_FIRMWARE_PATH_MT7986=' .config
          grep -qx 'CONFIG_MTK_FIRST_IF_IPAILNA=y' .config
          grep -qx 'CONFIG_MTK_RT_FIRST_IF_RF_OFFSET=0x0' .config
          grep -qx 'CONFIG_CONNINFRA_AUTO_UP=y' .config
          grep -qx 'CONFIG_CONNINFRA_EMI_SUPPORT=y' .config
          ! grep -qx 'CONFIG_PACKAGE_kmod-warp=y' .config
          ! grep -qx 'CONFIG_PACKAGE_kmod-mediatek_hnat=y' .config
          ! grep -Eq '^CONFIG_MTK_FAST_NAT_SUPPORT=(y|m)$' .config
          ! grep -Eq '^CONFIG_MTK_WHNAT_SUPPORT=(y|m)$' .config
          ! grep -Eq '^CONFIG_MTK_WARP_V2=(y|m)$' .config
          ! grep -Eq '^CONFIG_PACKAGE_iwinfo=(y|m)$' .config
          ! grep -Eq '^CONFIG_PACKAGE_mtwifi-cfg=(y|m)$' .config
          grep -Fq 'AUTOLOAD:=$(call AutoLoad,09,mtk_wifi_utility,1)' package/mtk/drivers/wifi_utility/Makefile
          grep -Fq 'AUTOLOAD:=$(call AutoLoad,10,conninfra,1)' package/mtk/drivers/conninfra/Makefile
          grep -Fq 'AUTOLOAD:=$(call AutoLoad,11,mt_wifi)' package/mtk/drivers/mt_wifi/Makefile
          ! grep -Fq 'AUTOLOAD:=$(call AutoLoad,11,mt_wifi,' package/mtk/drivers/mt_wifi/Makefile
            grep -qx 'PKG_VERSION:=7.6.6.1' package/mtk/drivers/mt_wifi/Makefile
          test -d "$GITHUB_WORKSPACE/.golden-mt_wifi-exact/.git"
          test "$(git -C "$GITHUB_WORKSPACE/.golden-mt_wifi-exact" rev-parse HEAD)" = "$GOLDEN_MT_WIFI_COMMIT"
          for patch in \
            002-sort-site-survey-table.patch \
            003-fix-rxrate-stainfo.patch \
            004-remove-apcli-bgprotect-log.patch \
            005-use-ext-warp-code.patch \
            006-fix-stainfo_struct.patch \
            007-fix-tx-phymode.patch \
            008-fix-he-gi-stainfo.patch \
            009-add-secinfo-to-stainfo.patch \
            010-remove-addba-noisy-log.patch \
            011-fix-wext-txpwr.patch \
            012-add-mt7986-memory-shrink-aggress.patch \
            013-add-rssi-for-sitesurvey.patch \
            014-fix-iwrange.patch \
            015-fix-apcli-stainfo.patch \
            016-fix-apcli-scan-no-ascii-ssid.patch \
            017-fix-secinfo-for-iwinfo.patch \
            018-fix-he-max-bw.patch \
            019-fix-vht-bw.patch \
            020-wapp-btm--steering.patch \
              021-add-roam-steering-setting.patch \
              022-fix-return-type.patch \
              100-since-v5.18-use-kernel_write-instead-of-__kernel_write.patch \
              112-since-v6.12-fix-unaligned_h-not-found-error.patch \
            113-since-v6.8-change-strlcpy-to-strscpy.patch \
            114-fix-fortify-warning-1-cmm_wpa.patch \
            115-fix-fortify-warning-2-pmf.patch \
            116-fix-fortify-warning-3-sta-sanity-memmove-overflow.patch \
            117-fix-fortify-warning-4-qos.patch \
            118-fix-rrm-snprintf-read-overflow.patch; do
            test -f "package/mtk/drivers/mt_wifi/patches/$patch"
          done
          test ! -e package/mtk/drivers/mt_wifi/patches/039-fix-qos-peer_vendor_spec_action-frame-check.patch
          test ! -e package/mtk/drivers/mt_wifi/patches/040-ap_mgmt_assoc-dont-reject-oversized-supported-channels-ie.patch
          grep -q '+wireless-tools' package/mtk/applications/mtwifi-cfg-ucode/Makefile
          grep -Fqx 'const DRIVERS = ["mt_wifi"];' package/mtk/applications/mtwifi-cfg-ucode/files/usr/share/ucode/mtwifi/driver.uc
          ! grep -Eq 'mtk_warp_proxy|mtk_warp' package/mtk/applications/mtwifi-cfg-ucode/files/usr/share/ucode/mtwifi/driver.uc
          DTS="target/linux/mediatek/dts/mt7986a-netcore-n60-pro.dts"
          grep -q 'factory: partition@180000' "$DTS"
          grep -A6 'factory: partition@180000' "$DTS" | grep -q 'reg = <0x180000 0x200000>;'
          grep -q 'mediatek,mtd-eeprom = <&factory 0x0>;' "$DTS"
          grep -A4 'eeprom_factory_0: eeprom@0' "$DTS" | grep -q 'reg = <0x0 0x1000>;'
          ! grep -A4 'eeprom_factory_0: eeprom@0' "$DTS" | grep -q 'reg = <0x0 0x5000>;'

      - name: Download sources
        working-directory: source
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -delete || true

      - name: Build firmware
        id: build
        working-directory: source
        shell: bash
        run: |
          set +e
          make -j"$(nproc)" V=sc > "$GITHUB_WORKSPACE/build-parallel.log" 2>&1
          rc=$?

          if [ "$rc" -ne 0 ]; then
            {
              echo "===== ERROR CONTEXT ====="
              grep -Ein -B 20 -A 20 'make\[[0-9]+\]: \*\*\*|error:|fatal:|undefined reference|modpost:|No rule to make target|Error [0-9]+' "$GITHUB_WORKSPACE/build-parallel.log" | tail -n 2500 || true
              echo
              echo "===== LAST 500 LINES ====="
              tail -n 500 "$GITHUB_WORKSPACE/build-parallel.log" || true
            } | tee "$GITHUB_WORKSPACE/build-error.log"
            gzip -9 -c "$GITHUB_WORKSPACE/build-parallel.log" > "$GITHUB_WORKSPACE/build-parallel.log.gz"
          else
            echo "Build completed successfully."
          fi

          exit "$rc"

      - name: Collect firmware
        run: |
          trap 'rc=$?; echo "::error::Collect firmware failed: line=$LINENO command=$BASH_COMMAND rc=$rc"; exit $rc' ERR
          mkdir -p artifact
          find source/bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*netcore_n60-pro*squashfs-sysupgrade.bin' -o -name '*netcore_n60-pro*initramfs-recovery.itb' -o -name '*netcore_n60-pro*.manifest' -o -name 'sha256sums' -o -name 'profiles.json' -o -name '*.buildinfo' \) \
            -exec cp -v {} artifact/ \;
          cp source/.config artifact/resolved.config
          test -n "$(find artifact -type f -name '*netcore_n60-pro*initramfs-recovery.itb' -print -quit)"
          test -n "$(find artifact -type f -name '*netcore_n60-pro*squashfs-sysupgrade.bin' -print -quit)"
          grep -q '25.12.1' artifact/profiles.json
          ! grep -q '25.12-SNAPSHOT' artifact/profiles.json
          test -f artifact/config.buildinfo
          grep -qx 'CONFIG_MTK_RT_FIRST_IF_RF_OFFSET=0x0' artifact/resolved.config
          grep -qx '# CONFIG_MTK_MT7986_NEW_FW is not set' artifact/resolved.config
          grep -qx 'CONFIG_MTK_WIFI_FW_BIN_LOAD=y' artifact/resolved.config
          grep -qx 'CONFIG_MTK_FIRST_IF_IPAILNA=y' artifact/resolved.config
          grep -qx 'CONFIG_MTK_TPC_SUPPORT=y' artifact/resolved.config
          grep -qx 'CONFIG_MTK_MGMT_TXPWR_CTRL=y' artifact/resolved.config
          test -d source/build_dir/target-aarch64_cortex-a53_musl/root-mediatek
          ROOTFS="$(realpath source/build_dir/target-aarch64_cortex-a53_musl/root-mediatek)"
          test -f "$ROOTFS/usr/sbin/iwpriv"
          test -x "$ROOTFS/usr/sbin/iwpriv"
          test -x "$ROOTFS/etc/init.d/openclash"
          MANIFEST="$(find source/bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*netcore_n60-pro*.manifest' -print -quit)"
          test -f "$MANIFEST"
          grep -Eq '^luci-app-store[[:space:]]' "$MANIFEST"
          test -n "$(find "$ROOTFS/lib/modules" -type f -name 'mtk_wifi_utility.ko' -print -quit)"
          test -n "$(find "$ROOTFS/lib/modules" -type f -name 'conninfra.ko' -print -quit)"
          test -n "$(find "$ROOTFS/lib/modules" -type f -name 'mt_wifi.ko' -print -quit)"
          grep -qx 'mtk_wifi_utility' "$ROOTFS/etc/modules.d/09-mt-wifi-utility"
          grep -qx 'conninfra' "$ROOTFS/etc/modules.d/10-conninfra"
          grep -qx 'mt_wifi' "$ROOTFS/etc/modules.d/11-mt_wifi"
          test -L "$ROOTFS/etc/modules-boot.d/09-mt-wifi-utility"
          test -L "$ROOTFS/etc/modules-boot.d/10-conninfra"
          test ! -e "$ROOTFS/etc/modules-boot.d/11-mt_wifi"
          ! grep -R -E 'mtk_warp_proxy|mtk_warp' "$ROOTFS/etc/modules.d"
          ! find "$ROOTFS/lib/modules" -type f -name 'mtk_warp_proxy.ko' | grep -q .
          L1PROFILE="$ROOTFS/etc/wireless/l1profile.dat"
          test -f "$L1PROFILE"
          grep -qx 'INDEX0_EEPROM_offset=0x0' "$L1PROFILE"
          grep -qx 'INDEX0_EEPROM_size=0x5000' "$L1PROFILE"
          test -f "$ROOTFS/etc/wireless/mediatek/mt7986-ax6000.dbdc.b0.dat"
          test -f "$ROOTFS/etc/wireless/mediatek/mt7986-ax6000.dbdc.b1.dat"
          test -f "$ROOTFS/etc/wireless/mediatek/mt7986-sku.dat"
          test -f "$ROOTFS/etc/wireless/mediatek/mt7986-sku-bf.dat"
          GOLDEN_FW="$ROOTFS/lib/firmware"
          for f in \
            7986_WACPU_RAM_CODE_release.bin \
            WIFI_RAM_CODE_MT7986.bin \
            WIFI_RAM_CODE_MT7986_MT7975.bin \
            mt7986_patch_e1_hdr.bin \
            mt7986_patch_e1_hdr_mt7975.bin; do
            test -f "$GOLDEN_FW/$f"
          done
          test ! -e "$ROOTFS/lib/firmware/SHA256SUMS"
          cat > artifact/GOLDEN-FW-SHA256SUMS.expected <<'EOF'
          0237b7a6376d9f477d18cc54ffef153444098643d72b55942401cedbb6955c6a  7986_WACPU_RAM_CODE_release.bin
          d473692bb6856370cda487db9264a0eeb63af60e76c4dac23cc9bb90211e6bbb  WIFI_RAM_CODE_MT7986.bin
          3717fb957f3e4f1acdd2d8cc613c309345d189a2e341b00c904ade67a6092bd3  WIFI_RAM_CODE_MT7986_MT7975.bin
          2f593cf19b2b6b50c963bd94c8d5a3838e3d9681527c200f496e4899a3144237  mt7986_patch_e1_hdr.bin
          0a1492b0d36a31556bbf951ab1ff3e7d372a5e50866f0efd12e9908cacc793c1  mt7986_patch_e1_hdr_mt7975.bin
          EOF
          sed -i 's/^[[:space:]]*//' artifact/GOLDEN-FW-SHA256SUMS.expected
          (cd "$GOLDEN_FW" && sha256sum -c "$GITHUB_WORKSPACE/artifact/GOLDEN-FW-SHA256SUMS.expected")
          cd artifact
          sha256sum * > BUILD-SHA256SUMS

      - name: Upload candidate even if validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-candidate-${{ github.run_number }}
          path: artifact/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-${{ github.run_number }}
          path: |
            build-error.log
            build-parallel.log.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: N60Pro-25.12.1-GOLDEN-EXACT-7661-RF-ENCLAVE
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
